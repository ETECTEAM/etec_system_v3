version: "3.8" # Docker compose version

services:

  # Laravel PHP container
  app:
    build: .              # Build container using Dockerfile in current folder
    container_name: laravel_app # Name of container
    working_dir: /var/www # Working directory inside container

    volumes:
      - .:/var/www        # Mount project folder into container
                          # So code changes instantly update inside container

    depends_on:
      - mysql             # Start MySQL container before starting Laravel


  # Nginx web server container
  nginx:
    image: nginx:latest   # Use official nginx image from Docker Hub
    container_name: laravel_nginx

    ports:
      - "8000:80"         # Map port 8000 on computer → port 80 in container
                          # App accessible at http://localhost:8000

    volumes:
      - .:/var/www        # Mount Laravel project
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
                          # Use our custom nginx configuration file


  # MySQL database container
  mysql:
    image: mysql:8        # Official MySQL image
    container_name: laravel_mysql

    restart: always       # Restart container automatically if it crashes

    environment:
      MYSQL_DATABASE: laravel       # Create database named "laravel"
      MYSQL_ROOT_PASSWORD: root     # Root password

    ports:
      - "3306:3306"       # Expose MySQL port so tools like TablePlus can connect
