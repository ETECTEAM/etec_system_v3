# Zone tracks request rate per client IP (10MB ~= ~160k tracked IPs); shared
# across all worker processes so the limit holds app-wide, not per-worker.
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
# Separate, tighter zone for PHP-FPM-hitting requests specifically - these are
# the expensive ones (DB queries, sessions), so they get their own budget.
limit_req_zone $binary_remote_addr zone=php:10m rate=10r/s;
# Caps concurrent (not just per-second) connections from a single IP, which is
# what actually protects PHP-FPM's worker pool during a burst/flood.
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Websocket upgrade only on a matching Upgrade header, not every request -
# standard nginx proxy pattern for reverse-proxying a ws(s) backend.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 20M;

    # Reject with 503 instead of queuing floods indefinitely.
    limit_req_status 503;
    limit_conn_status 503;

    limit_conn conn_limit 20;
    limit_req zone=general burst=40 nodelay;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverb's Pusher-compatible websocket endpoint (Echo connects to /app/{key}).
    # ^~ stops regex locations below from ever intercepting this path.
    location ^~ /app {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        limit_req zone=php burst=15 nodelay;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
