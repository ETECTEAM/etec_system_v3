# Zone tracks request rate per client IP (10MB ~= ~160k tracked IPs); shared
# across all worker processes so the limit holds app-wide, not per-worker.
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
# Separate, tighter zone for PHP-FPM-hitting requests specifically - these are
# the expensive ones (DB queries, sessions), so they get their own budget.
limit_req_zone $binary_remote_addr zone=php:10m rate=10r/s;
# Caps concurrent (not just per-second) connections from a single IP, which is
# what actually protects PHP-FPM's worker pool during a burst/flood.
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Websocket upgrade only on a matching Upgrade header, not every request -
# standard nginx proxy pattern for reverse-proxying a ws(s) backend.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The container is bound to loopback; the trusted TLS proxy sets this header.
map $http_x_forwarded_proto $security_hsts {
    default "";
    https "max-age=31536000";
}

server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    server_tokens off;
    fastcgi_hide_header X-Powered-By;
    add_header Strict-Transport-Security $security_hsts always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Attendance/location locks need geolocation; allow it only on our origin.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), browsing-topics=()" always;
    # Vue needs inline styles. Scripts deliberately allow neither inline nor eval.
    # Reverb is served through /app on this host; add an explicit wss origin if moved.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss://$host https://challenges.cloudflare.com; frame-src 'self' blob: https://challenges.cloudflare.com https://maps.google.com https://www.google.com https://www.openstreetmap.org; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;

    client_max_body_size 1050M;

    # Reject with 503 instead of queuing floods indefinitely.
    limit_req_status 503;
    limit_conn_status 503;

    limit_conn conn_limit 20;
    limit_req zone=general burst=40 nodelay;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverb's Pusher-compatible websocket endpoint (Echo connects to /app/{key}).
    # ^~ stops regex locations below from ever intercepting this path.
    location ^~ /app {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        limit_req zone=php burst=15 nodelay;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_read_timeout 300;
        # Without this, fastcgi_params passes the client's raw X-Forwarded-For
        # header straight through unmodified - a client could set it directly
        # and spoof their IP to Laravel's trusted-proxy resolver. This appends
        # the real connecting IP as the trusted (rightmost) hop instead.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
