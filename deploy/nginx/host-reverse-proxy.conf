# Host-level Nginx (native, installed via apt) — reverse proxies HTTPS traffic
# to the Dockerized app stack, which listens on 127.0.0.1:8080 (see
# docker-compose.prod.yml's nginx service, which publishes "127.0.0.1:8080:80").
# SSL is terminated here by certbot.
#
# Install to /etc/nginx/sites-available/etec-system.conf, then:
#   sudo ln -s /etc/nginx/sites-available/etec-system.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace DOMAIN below with your real domain before running certbot.

# This is the first thing a flood hits, before it ever reaches the Docker
# container's own nginx/PHP-FPM limits — so it needs its own budget here too.
# Zone sized for ~160k tracked IPs; shared across workers so the limit holds
# host-wide, not per-worker.
limit_req_zone $binary_remote_addr zone=host_general:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=host_conn:10m;

upstream etec_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    # certbot uses this for the HTTP-01 challenge; leave it above the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN www.DOMAIN;

    # certbot --nginx will fill these in automatically; placeholders shown
    # so `nginx -t` doesn't fail before the first certificate is issued.
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    access_log /var/log/nginx/etec-system.access.log;
    error_log  /var/log/nginx/etec-system.error.log;

    # Reject with 503 instead of queuing floods indefinitely.
    limit_req_status 503;
    limit_conn_status 503;

    limit_conn host_conn 20;
    limit_req zone=host_general burst=40 nodelay;

    location / {
        proxy_pass http://etec_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
