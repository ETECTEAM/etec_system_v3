opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.save_comments=1

; validate_timestamps=0 skips per-request mtime checks (meaningful perf win),
; but means code changes need `docker compose restart app` to take effect -
; there is no live-reload in production, unlike the dev bind-mounted stage.
opcache.validate_timestamps=0
